# Loopera production stack
# Usage: docker compose --env-file .env.production up -d --build
# Optional admin UI: docker compose --profile admin up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: loopera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-loopera}
      POSTGRES_USER: ${DB_USER:-loopera}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - loopera-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-loopera} -d ${DB_NAME:-loopera}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: loopera-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - loopera-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  melody:
    build:
      context: ../melody-service
      dockerfile: Dockerfile
    container_name: loopera-melody
    restart: unless-stopped
    environment:
      MELODY_PORT: 8001
      MELODY_USE_MUSIC_VAE: ${MELODY_USE_MUSIC_VAE:-true}
    networks:
      - loopera-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: loopera-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      MELODY_SERVICE_URL: http://melody:8001
      FRONTEND_URL: ${FRONTEND_URL:-https://loopera.ru}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - loopera-network
    # Backend is internal only — Caddy → frontend nginx → backend
    expose:
      - "5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      melody:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 25s

  frontend:
    build:
      context: ../frontend-repo
      dockerfile: Dockerfile.frontend
      args:
        # Same-origin behind Caddy/nginx — leave empty in prod
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_MEDIA_CDN_URL: ${VITE_MEDIA_CDN_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: loopera-frontend
    restart: unless-stopped
    networks:
      - loopera-network
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: loopera-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-loopera.ru}
      ACME_EMAIL: ${ACME_EMAIL:-ops@loopera.ru}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - loopera-network
    depends_on:
      frontend:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: loopera-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@loopera.ru}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD when using --profile admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - loopera-network
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - admin

networks:
  loopera-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  redis_data:
  caddy_data:
  caddy_config:
  pgadmin_data:
